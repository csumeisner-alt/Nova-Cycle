name: Build NovaCycle APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create/update releases
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacycle-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Compute a short commit SHA for the versioned tag
      - name: Set version tag
        if: github.event_name != 'pull_request'
        id: version
        run: echo "tag=v$(date -u +'%Y-%m-%d')-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Only publish a release on pushes to main/master (not PRs)
      - name: Publish versioned GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body: |
            Automatically published from commit ${{ github.sha }} on ${{ github.ref_name }}.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.run_id }}

            Install this APK directly on your Android device — no GitHub login required.
            To roll back, download the APK from any earlier release listed on the Releases page.
          artifacts: android/app/build/outputs/apk/release/app-release.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: false      # Never overwrite a versioned release
          makeLatest: false        # The rolling "latest" tag controls what is marked latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling "latest" GitHub Release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Latest Release Build"
          body: |
            Automatically published from the latest commit on ${{ github.ref_name }}.

            **Commit:** ${{ github.sha }}
            **Built:** ${{ github.run_id }}
            **Versioned release:** ${{ steps.version.outputs.tag }}

            Install this APK directly on your Android device — no GitHub login required.
            Previous versions are available on the [Releases page](../../releases).
          artifacts: android/app/build/outputs/apk/release/app-release.apk
          artifactContentType: application/vnd.android.package-archive
          allowUpdates: true       # Overwrite the existing "latest" release each time
          removeArtifacts: true    # Replace old APK so there is always one file
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
