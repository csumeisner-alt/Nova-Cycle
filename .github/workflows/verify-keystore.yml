name: Verify Release Keystore Backup

# Runs automatically on the first of every month and can also be triggered
# manually from the GitHub Actions UI at any time.
on:
  schedule:
    - cron: '0 9 1 * *'   # 09:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  verify-keystore:
    name: Decode & verify keystore
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (provides keytool)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore from KEYSTORE_BASE64
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/novacycle-verify.p12
          echo "Decoded keystore size: $(wc -c < /tmp/novacycle-verify.p12) bytes"
          if [ ! -s /tmp/novacycle-verify.p12 ]; then
            echo "::error::Decoded keystore file is empty — the base64 blob may be truncated or corrupt."
            exit 1
          fi

      - name: Verify keystore with keytool
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is empty or not set."
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS secret is empty or not set."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is empty or not set."
            exit 1
          fi

          echo "--- Listing all entries in the keystore ---"
          keytool -list -v \
            -keystore /tmp/novacycle-verify.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            2>&1 | grep -E "^(Alias name|Entry type|Creation date|Certificate fingerprint|Owner|Issuer|Serial number|Valid from|Keystore type|Your keystore contains)"

          echo ""
          echo "--- Verifying key alias '$KEY_ALIAS' is present ---"
          keytool -list \
            -keystore /tmp/novacycle-verify.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            2>&1

          echo ""
          echo "--- Verifying KEY_PASSWORD unlocks the key entry ---"
          keytool -exportcert \
            -keystore /tmp/novacycle-verify.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -file /tmp/novacycle-verify.crt \
            2>&1

          if [ ! -s /tmp/novacycle-verify.crt ]; then
            echo "::error::Certificate export failed — KEY_PASSWORD or KEY_ALIAS may be wrong."
            exit 1
          fi

          echo "::notice::Keystore backup verified successfully. Alias '$KEY_ALIAS' is present and all passwords match."

      - name: Clean up decoded files
        if: always()
        run: |
          rm -f /tmp/novacycle-verify.p12 /tmp/novacycle-verify.crt

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Keystore verification failed. The backed-up keystore or its credentials may be corrupt, missing, or rotated."
          echo ""
          echo "Action required:"
          echo "  1. Check the steps above for the specific error."
          echo "  2. Restore or re-upload KEYSTORE_BASE64 (and companion secrets) from your secure backup."
          echo "  3. Re-run this workflow to confirm the fix."
          echo ""
          echo "If you have configured a SLACK_WEBHOOK_URL or similar notification secret,"
          echo "add a curl step here to post an alert to your team channel."
