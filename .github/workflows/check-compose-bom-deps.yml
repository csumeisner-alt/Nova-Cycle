name: Check Compose BOM Dependency Tree

# Runs on every PR that touches Android source, Gradle build files, or the
# version catalog.  Catches silent version conflicts that a BOM bump can
# introduce — for example, material-icons-extended being re-pinned to a
# version that conflicts with another Compose artifact.
on:
  pull_request:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/check-compose-bom-deps.yml'
  workflow_dispatch: # Allow manual runs from the GitHub Actions UI

jobs:
  check-dependency-tree:
    name: Verify dependency configurations are conflict-free
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Validate that the grep patterns used in this workflow correctly detect
      # every failure mode before running the expensive Gradle steps.  The
      # script uses only bash and synthesised fixtures — no Android SDK needed.
      - name: Validate grep patterns (dep-conflict check self-test)
        run: bash android/scripts/test-dep-conflict-check.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Re-use Gradle caches from the main build workflow where possible so
      # this job doesn't re-download all dependencies on every run.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # Resolve the full runtime dependency graph for every configuration we
      # care about and save each tree to its own file.  Checking more than just
      # releaseRuntimeClasspath catches conflicts that only surface in debug
      # builds, instrumented-test runs, or annotation-processor classpaths.
      - name: Resolve dependency trees for all checked configurations
        working-directory: android
        run: |
          CONFIGS=(
            releaseRuntimeClasspath
            debugRuntimeClasspath
            debugAndroidTestRuntimeClasspath
            testDebugRuntimeClasspath
            kaptReleaseClasspath
            kaptDebugClasspath
          )

          mkdir -p /tmp/dep-trees
          FAILED_CONFIGS=()

          for CFG in "${CONFIGS[@]}"; do
            echo "::group::Resolving $CFG"
            OUT="/tmp/dep-trees/${CFG}.txt"
            # Some configurations may not exist (e.g. kapt configs when kapt is
            # not applied, or test configs before test sources exist).  We treat
            # a "configuration not found" exit gracefully — the tree file will
            # contain Gradle's error, which the conflict checks below will not
            # flag (no FAILED / duplicate-class markers expected in that output).
            ./gradlew :app:dependencies \
              --configuration "$CFG" \
              --no-daemon \
              2>&1 | tee "$OUT" || FAILED_CONFIGS+=("$CFG")
            echo "::endgroup::"
          done

          if [ ${#FAILED_CONFIGS[@]} -gt 0 ]; then
            echo "::error::Gradle exited non-zero while resolving: ${FAILED_CONFIGS[*]}"
            exit 1
          fi

      # Exit non-zero when Gradle could not resolve an artifact in ANY
      # configuration.  This covers the most common BOM-bump failure: a new BOM
      # version that references a coordinate that doesn't yet exist in Maven
      # Central.
      - name: Fail on unresolved dependencies (FAILED markers)
        run: |
          FOUND=0
          for F in /tmp/dep-trees/*.txt; do
            CFG=$(basename "$F" .txt)
            if grep -qE "^.*FAILED$" "$F"; then
              echo "::error::[$CFG] One or more dependencies failed to resolve. \
          A recent BOM bump may have introduced a version conflict."
              echo ""
              echo "--- [$CFG] Lines with FAILED ---"
              grep -E "FAILED$" "$F" || true
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No FAILED resolution markers found in any configuration."

      # Gradle prints "duplicate class" warnings (and sometimes errors) when
      # two artifacts on the classpath provide the same fully-qualified class.
      # material-icons-extended historically caused this when an explicit version
      # pin conflicted with the BOM-managed version.
      - name: Fail on duplicate-class warnings
        run: |
          FOUND=0
          for F in /tmp/dep-trees/*.txt; do
            CFG=$(basename "$F" .txt)
            if grep -qi "duplicate class" "$F"; then
              echo "::error::[$CFG] Duplicate-class warning detected in the \
          dependency tree.  The Compose BOM version may be pulling in a \
          conflicting copy of material-icons-extended (or another artifact)."
              echo ""
              echo "--- [$CFG] Duplicate-class lines ---"
              grep -i "duplicate class" "$F" || true
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "No duplicate-class warnings found in any configuration."

      # Check for version conflicts indicated by "conflict" appearing in the
      # dependency tree output (e.g. "version conflict" resolution notices that
      # indicate forced downgrades).
      - name: Warn on forced version conflict resolutions
        run: |
          ANY_CONFLICTS=0
          for F in /tmp/dep-trees/*.txt; do
            CFG=$(basename "$F" .txt)
            # Extract lines that contain both a conflict indicator and a Compose
            # group ID so noise from unrelated dependencies is filtered out.
            CONFLICTS=$(grep -i "conflict" "$F" \
              | grep -i "androidx.compose" || true)
            if [ -n "$CONFLICTS" ]; then
              echo "::warning::[$CFG] Compose dependency version conflicts \
          detected.  Review whether forced resolutions are intentional after \
          the BOM bump."
              echo ""
              echo "--- [$CFG] Compose conflict lines ---"
              echo "$CONFLICTS"
              ANY_CONFLICTS=1
            fi
          done
          if [ "$ANY_CONFLICTS" -eq 0 ]; then
            echo "No Compose version conflict resolutions found in any configuration."
          fi

      # ── Validation note ────────────────────────────────────────────────────
      # The grep patterns in the three steps above have been validated end-to-end
      # against synthetic dep-tree fixtures that reproduce each failure mode:
      #
      #   1. FAILED marker — an artifact Gradle could not resolve (e.g. a BOM
      #      bump that references a coordinate not yet published to Maven Central).
      #      Reproduced by: a dep-tree line ending with "material-icons-extended:
      #      1.7.0 FAILED".  The `grep -qE "^.*FAILED$"` pattern correctly exits
      #      non-zero.
      #
      #   2. Duplicate-class warning — the historical material-icons-extended
      #      failure: an explicit version pin (e.g. 1.5.4) and the BOM-managed
      #      version (e.g. 1.7.0) both land on the classpath, causing Gradle to
      #      emit "Duplicate class androidx.compose.material.icons.Icons found in
      #      modules: material-icons-extended-1.5.4.jar / 1.7.0.jar".  The
      #      `grep -qi "duplicate class"` pattern correctly exits non-zero.
      #
      #   3. Compose conflict-resolution notice — Gradle prints "1.7.0 -> 1.5.4
      #      (conflict resolution)" when it forces a downgrade to satisfy an
      #      explicit pin.  The combined `grep -i conflict | grep -i androidx.compose`
      #      pattern correctly surfaces the warning.
      #
      #   4. Clean tree — all three checks produce no false positives when the
      #      dependency tree contains no conflict markers.
      #
      # Validation script: android/scripts/test-dep-conflict-check.sh
      # Run `bash android/scripts/test-dep-conflict-check.sh` from the repo root
      # to re-exercise all four fixtures locally (no Android SDK required).
      # ───────────────────────────────────────────────────────────────────────

      # Always upload all dependency trees so engineers can inspect them in
      # the Actions UI even when the job passes.
      - name: Upload dependency trees as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-trees
          path: /tmp/dep-trees/
          if-no-files-found: ignore
