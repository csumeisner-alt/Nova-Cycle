kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash -c 'cd /home/runner/workspace/artifacts/api-server/backend && pip install -q -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8080 --reload'"

[services.production]

[services.production.build]
args = ["bash", "-c", "cd /home/runner/workspace/artifacts/api-server/backend && pip install -r requirements.txt"]

[services.production.run]
args = ["bash", "-c", "cd /home/runner/workspace/artifacts/api-server/backend && uvicorn main:app --host 0.0.0.0 --port 8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
